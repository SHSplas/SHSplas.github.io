    <body>
            <script src="scripts.js"></script> #connectes to the scripts.js file

            <script>

                function updateTime() {

                var timeText = document.querySelector("#timeElement");

                    cursor: move;
                }
                .closebutton {
                    width: 16px;
                    height: 16px;
